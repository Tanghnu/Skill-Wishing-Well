# 展示配置 / Display configuration
interface:
  display_name: "Skill许愿池 / Skill Wishing Well"
  short_description: "诊断、推敲与技能构建 / Diagnose, challenge and build skills"
  default_prompt: "使用 $skill-wishing-well 分析我的困扰，制定目标与验收标准，按需推敲关键假设和取舍，寻找合适能力，并在我的请求范围内完成方案或构建。 / Use $skill-wishing-well to diagnose my problem, propose goals and acceptance criteria, examine consequential assumptions and tradeoffs as needed, find suitable capabilities, and complete a plan or build within my request."
# 保留自动发现 / Preserve automatic discovery
policy:
  allow_implicit_invocation: true
